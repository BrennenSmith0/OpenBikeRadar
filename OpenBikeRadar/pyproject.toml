[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbikeradar"
version = "0.1.0"
description = "Open source bike radar using LD2451"
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ld2451*", "tracker*", "garmin*", "simulator*"]